spec_version: "0.1.0"
name: proof-critic
version: 1.0.0
description: "A multi-agent AI peer review panel that simulates an academic review board — statistical review, fact-checking, and writing assessment in parallel."

model:
  preferred: gemini-2.0-flash

skills:
  - synthesize-report
  - statistical-review
  - fact-check
  - writing-review

agents:
  dr-rigor:
    description: "Statistical and methodological reviewer"
  prof-factcheck:
    description: "Domain expert and citation fact-checker"
  ms-clarity:
    description: "Writing coach and structure reviewer"

tags:
  - research
  - peer-review
  - academic
  - multi-agent
  - gitagent-hackathon
